version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: krishimitra-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=rule_engine
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - DATABASE_URL=sqlite:///./krishimitra.db
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
      - ./krishimitra.db:/app/krishimitra.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishimitra-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    restart: unless-stopped
